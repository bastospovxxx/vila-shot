<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>FPS Online 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #instructions {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; text-align: center; cursor: pointer;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      margin: -5px 0 0 -5px; border: 2px solid red; border-radius: 50%; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="instructions">
    <h1>Clique para Jogar</h1>
    <p>Use WASD para andar e o mouse para olhar em volta.</p>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { PointerLockControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, set, onValue, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // Suas credenciais do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAYIO8f8f_ss7vVfpq4utm8SScnli0d4-c",
      authDomain: "vila-shot.firebaseapp.com",
      databaseURL: "https://vila-shot-default-rtdb.firebaseio.com",
      projectId: "vila-shot",
      storageBucket: "vila-shot.firebasestorage.app",
      messagingSenderId: "513956353013",
      appId: "1:513956353013:web:cc19d3a6ea5afd7138c6bc",
      measurementId: "G-PC9D5X0PJN"
    };

    // Inicializa Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playerId = 'player_' + Math.floor(Math.random() * 100000);
    const playerRef = ref(db, 'players/' + playerId);
    onDisconnect(playerRef).remove();

    // Cena 3D
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Iluminação
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 15);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Chão
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshLambertGeometry({ color: 0x228b22 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Controles FPS
    const controls = new PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');
    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => instructions.style.display = 'block');

    camera.position.y = 1.6;

    // Movimentação
    const move = { forward: false, backward: false, left: false, right: false };
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') move.forward = true;
      if (e.code === 'KeyS') move.backward = true;
      if (e.code === 'KeyA') move.left = true;
      if (e.code === 'KeyD') move.right = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') move.forward = false;
      if (e.code === 'KeyS') move.backward = false;
      if (e.code === 'KeyA') move.left = false;
      if (e.code === 'KeyD') move.right = false;
    });

    // Gerenciamento dos outros jogadores
    const otherPlayers = {};
    const playerGeo = new THREE.BoxGeometry(1, 2, 1);
    const playerMat = new THREE.MeshLambertGeometry({ color: 0xff0000 });

    onValue(ref(db, 'players'), (snapshot) => {
      const players = snapshot.val() || {};
      
      // Remove jogadores que saíram
      Object.keys(otherPlayers).forEach(id => {
        if (!players[id]) {
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
      });

      // Atualiza ou cria novos jogadores na tela
      Object.keys(players).forEach(id => {
        if (id === playerId) return;
        const p = players[id];
        if (!otherPlayers[id]) {
          const mesh = new THREE.Mesh(playerGeo, playerMat);
          scene.add(mesh);
          otherPlayers[id] = mesh;
        }
        otherPlayers[id].position.set(p.x, p.y, p.z);
      });
    });

    // Loop do Jogo
    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        if (move.forward) controls.moveForward(0.15);
        if (move.backward) controls.moveForward(-0.15);
        if (move.left) controls.moveRight(-0.15);
        if (move.right) controls.moveRight(0.15);

        // Envia a posição para o Firebase
        set(playerRef, {
          x: camera.position.x,
          y: camera.position.y - 0.8,
          z: camera.position.z
        });
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
