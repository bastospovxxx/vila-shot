<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>RPG 2D Online - Terraria Multiplayer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0c; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
    #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    canvas { display: block; }
    
    #hud { position: absolute; top: 15px; left: 15px; pointer-events: none; }
    .hud-card { background: rgba(15, 15, 25, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 16px; border-radius: 8px; backdrop-filter: blur(6px); font-size: 13px; }

    #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(10, 10, 15, 0.85); padding: 8px; border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.2); }
    .slot { width: 44px; height: 44px; border: 2px solid #444; border-radius: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; background: rgba(255, 255, 255, 0.05); user-select: none; }
    .slot.active { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
    .slot-num { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #aaa; }
    .block-preview { width: 20px; height: 20px; border-radius: 3px; }

    #chat-container { position: absolute; bottom: 20px; left: 20px; width: 320px; background: rgba(10, 10, 15, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 10px; }
    #chat-messages { height: 120px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .chat-msg { background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 4px; }
    #chat-input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; outline: none; font-size: 12px; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-card">
      <div style="font-weight: bold; color: #00ffcc;">🟢 CONECTADO AO FIREBASE</div>
      <div><b>A/D:</b> Andar | <b>W/Espaço:</b> Pular</div>
      <div><b>Clique Esq:</b> Minerar | <b>Clique Dir:</b> Colocar</div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="hotbar">
    <div class="slot active" data-slot="1"><span class="slot-num">1</span><div class="block-preview" style="background:#4CAF50;"></div></div>
    <div class="slot" data-slot="2"><span class="slot-num">2</span><div class="block-preview" style="background:#795548;"></div></div>
    <div class="slot" data-slot="3"><span class="slot-num">3</span><div class="block-preview" style="background:#607D8B;"></div></div>
    <div class="slot" data-slot="4"><span class="slot-num">4</span><div class="block-preview" style="background:#FF9800;"></div></div>
  </div>

  <div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="Digite no chat RP..." maxlength="60">
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, set, onValue, onDisconnect, push } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAYIO8f8f_ss7vVfpq4utm8SScnli0d4-c",
    authDomain: "vila-shot.firebaseapp.com",
    databaseURL: "https://vila-shot-default-rtdb.firebaseio.com",
    projectId: "vila-shot",
    storageBucket: "vila-shot.firebasestorage.app",
    messagingSenderId: "513956353013",
    appId: "1:513956353013:web:cc19d3a6ea5afd7138c6bc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const playerId = 'player_' + Math.floor(Math.random() * 1000000);
  const playerColor = 'hsl(' + Math.floor(Math.random() * 360) + ', 80%, 60%)';
  const playerRef = ref(db, 'online_rp_players/' + playerId);
  onDisconnect(playerRef).remove();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const TILE_SIZE = 32;
  const COLS = 150;
  const ROWS = 80;
  const SURFACE_LEVEL = 25;

  const worldMap = [];
  for (let r = 0; r < ROWS; r++) {
    worldMap[r] = [];
    for (let c = 0; c < COLS; c++) {
      if (r < SURFACE_LEVEL) worldMap[r][c] = 0;
      else if (r === SURFACE_LEVEL) worldMap[r][c] = 1;
      else if (r < SURFACE_LEVEL + 8) worldMap[r][c] = 2;
      else worldMap[r][c] = 3;
    }
  }

  const camera = { x: 0, y: 0 };
  const player = {
    x: (COLS / 2) * TILE_SIZE,
    y: (SURFACE_LEVEL - 3) * TILE_SIZE,
    width: 22, height: 38,
    vx: 0, vy: 0, speed: 4.2, jumpForce: -10,
    grounded: false, color: playerColor, selectedBlock: 1,
    chatMsg: '', chatTimer: 0
  };

  const otherPlayers = {};
  const keys = {};

  window.addEventListener('keydown', e => {
    if (document.activeElement === document.getElementById('chat-input')) return;
    keys[e.code] = true;
    if (e.code === 'Digit1') setSlot(1);
    if (e.code === 'Digit2') setSlot(2);
    if (e.code === 'Digit3') setSlot(3);
    if (e.code === 'Digit4') setSlot(4);
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  function setSlot(num) {
    player.selectedBlock = num;
    document.querySelectorAll('.slot').forEach((s, idx) => {
      s.classList.toggle('active', idx + 1 === num);
    });
  }
  document.querySelectorAll('.slot').forEach(s => {
    s.addEventListener('click', () => setSlot(parseInt(s.dataset.slot)));
  });

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => {
    const worldMouseX = e.clientX + camera.x;
    const worldMouseY = e.clientY + camera.y;
    const c = Math.floor(worldMouseX / TILE_SIZE);
    const r = Math.floor(worldMouseY / TILE_SIZE);

    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      if (e.button === 0 && worldMap[r][c] !== 0) {
        worldMap[r][c] = 0;
        set(ref(db, `online_map/${r}_${c}`), 0);
      } else if (e.button === 2 && worldMap[r][c] === 0) {
        worldMap[r][c] = player.selectedBlock;
        set(ref(db, `online_map/${r}_${c}`), player.selectedBlock);
      }
    }
  });

  // Sincroniza Blocos Quebrados/Colocados com Todos
  onValue(ref(db, 'online_map'), snapshot => {
    const data = snapshot.val() || {};
    Object.keys(data).forEach(key => {
      const [r, c] = key.split('_').map(Number);
      if (r < ROWS && c < COLS) worldMap[r][c] = data[key];
    });
  });

  // Sincroniza Outros Jogadores
  onValue(ref(db, 'online_rp_players'), snapshot => {
    const data = snapshot.val() || {};
    Object.keys(data).forEach(id => {
      if (id !== playerId) otherPlayers[id] = data[id];
    });
    Object.keys(otherPlayers).forEach(id => {
      if (!data[id]) delete otherPlayers[id];
    });
  });

  // Chat
  const chatInput = document.getElementById('chat-input');
  const chatMessages = document.getElementById('chat-messages');

  chatInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && chatInput.value.trim() !== '') {
      const text = chatInput.value.trim();
      push(ref(db, 'online_chat'), { sender: playerId.slice(-4), text: text, color: player.color });
      player.chatMsg = text;
      player.chatTimer = 200;
      chatInput.value = '';
      chatInput.blur();
    }
  });

  onValue(ref(db, 'online_chat'), snapshot => {
    chatMessages.innerHTML = '';
    const data = snapshot.val() || {};
    const msgs = Object.values(data).slice(-15);
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = `<span style="color:${m.color}"><b>[${m.sender}]:</b></span> ${m.text}`;
      chatMessages.appendChild(div);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });

  function update() {
    player.vx = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
    if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;

    if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.grounded) {
      player.vy = player.jumpForce;
      player.grounded = false;
    }

    player.vy += 0.45;

    player.x += player.vx;
    checkCollisionX();

    player.y += player.vy;
    checkCollisionY();

    if (player.chatTimer > 0) player.chatTimer--;

    camera.x += (player.x + player.width / 2 - canvas.width / 2 - camera.x) * 0.1;
    camera.y += (player.y + player.height / 2 - canvas.height / 2 - camera.y) * 0.1;

    camera.x = Math.max(0, Math.min(camera.x, COLS * TILE_SIZE - canvas.width));
    camera.y = Math.max(0, Math.min(camera.y, ROWS * TILE_SIZE - canvas.height));

    // Atualiza Posição no Firebase
    set(playerRef, {
      x: player.x,
      y: player.y,
      color: player.color,
      chatMsg: player.chatTimer > 0 ? player.chatMsg : ''
    });
  }

  function checkCollisionX() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (worldMap[r][c] !== 0) {
          const tileX = c * TILE_SIZE, tileY = r * TILE_SIZE;
          if (player.x < tileX + TILE_SIZE && player.x + player.width > tileX && player.y < tileY + TILE_SIZE && player.y + player.height > tileY) {
            if (player.vx > 0) player.x = tileX - player.width;
            if (player.vx < 0) player.x = tileX + TILE_SIZE;
          }
        }
      }
    }
  }

  function checkCollisionY() {
    player.grounded = false;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (worldMap[r][c] !== 0) {
          const tileX = c * TILE_SIZE, tileY = r * TILE_SIZE;
          if (player.x < tileX + TILE_SIZE && player.x + player.width > tileX && player.y < tileY + TILE_SIZE && player.y + player.height > tileY) {
            if (player.vy > 0) { player.y = tileY - player.height; player.vy = 0; player.grounded = true; }
            else if (player.vy < 0) { player.y = tileY + TILE_SIZE; player.vy = 0; }
          }
        }
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#6ba3d6';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

    const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
    const endCol = Math.min(COLS, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
    const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
    const endRow = Math.min(ROWS, Math.ceil((camera.y + canvas.height) / TILE_SIZE));

    for (let r = startRow; r < endRow; r++) {
      for (let c = startCol; c < endCol; c++) {
        const type = worldMap[r][c];
        if (type !== 0) {
          if (type === 1) ctx.fillStyle = '#4CAF50';
          else if (type === 2) ctx.fillStyle = '#795548';
          else if (type === 3) ctx.fillStyle = '#607D8B';
          else if (type === 4) ctx.fillStyle = '#FF9800';
          ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          ctx.strokeStyle = 'rgba(0,0,0,0.1)';
          ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }
    }

    Object.keys(otherPlayers).forEach(id => {
      const p = otherPlayers[id];
      drawPlayer(p.x, p.y, p.color, id.slice(-4), p.chatMsg);
    });

    drawPlayer(player.x, player.y, player.color, 'Você', player.chatTimer > 0 ? player.chatMsg : '');

    ctx.restore();
  }

  function drawPlayer(x, y, color, label, speech) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, player.width, player.height);

    ctx.fillStyle = '#FFF';
    ctx.fillRect(x + 4, y + 8, 5, 5); ctx.fillRect(x + 13, y + 8, 5, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 7, y + 10, 2, 2); ctx.fillRect(x + 16, y + 10, 2, 2);

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + player.width / 2, y - 8);

    if (speech) {
      ctx.font = '12px sans-serif';
      const textWidth = ctx.measureText(speech).width;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(x + player.width / 2 - textWidth / 2 - 6, y - 34, textWidth + 12, 20);
      ctx.fillStyle = '#FFF';
      ctx.fillText(speech, x + player.width / 2, y - 20);
    }
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }
  loop();
</script>

</body>
</html>
